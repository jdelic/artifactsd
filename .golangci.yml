# golangci-lint v2 configuration for artifactsd (design/13 §1).
# Curated linter set plus the gofumpt formatter. Run via `make lint`,
# `make fmt` or `make check`; the version is pinned in tools/go.mod.
version: "2"

run:
  tests: true

linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - gocritic
    - gosec
    - govet
    - ineffassign
    - misspell
    - revive
    - sqlclosecheck
    - staticcheck
    - unused
  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment # not worth the churn; readability over packing
        - shadow # opt-in, noisy (esp. err/rec in tests); low real-bug yield
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
      disabled-checks:
        - whyNoLint
        - unnamedResult # named multi-returns add shadow churn for little gain
    misspell:
      locale: US
    gosec:
      excludes:
        - G115 # integer overflow conversions; noisy, handled case-by-case
        - G101 # SQL column lists containing "token_hash" etc. are not credentials
    revive:
      rules:
        - name: exported
          disabled: true # doc.go comments cover packages; per-symbol enforced via go doc conventions
  exclusions:
    # No preset exclusions (v1: exclude-use-default: false).
    rules:
      # Test files: relax security/error checks that don't matter in tests.
      - path: _test\.go
        linters:
          - bodyclose
          - errcheck
          - gosec

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      # Own packages in a separate import group after third-party ones.
      local-prefixes:
        - github.com/jdelic/artifactsd
