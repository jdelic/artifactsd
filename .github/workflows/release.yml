name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    name: goreleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Generate release notes
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          # Visible release message = the annotated tag's own message; the commit
          # list goes into a collapsible below it, each commit linked by its short
          # id (artifactsd-60i). The exclude set mirrors .goreleaser.yml's
          # changelog filters. Written to a gitignored file so goreleaser's
          # dirty-tree check still passes; passed to it via --release-notes.
          subject="$(git tag -l --format='%(contents:subject)' "$TAG")"
          body="$(git tag -l --format='%(contents:body)' "$TAG")"
          {
            printf '%s\n' "$subject"
            if [ -n "$body" ]; then printf '\n%s\n' "$body"; fi
          } > release-notes.md

          prev="$(git describe --tags --abbrev=0 --match 'v*' "${TAG}^" 2>/dev/null || true)"
          if [ -n "$prev" ]; then range="${prev}..${TAG}"; else range="$TAG"; fi

          commits="$(git log --no-merges --reverse --pretty=format:'%H%x09%h%x09%s' "$range" \
            | grep -vE $'\t(docs|test|beads):' \
            | awk -F'\t' -v repo="$REPO" \
                '{printf "- [%s](https://github.com/%s/commit/%s) %s\n", $2, repo, $1, $3}' \
            || true)"

          if [ -n "$commits" ]; then
            count="$(printf '%s\n' "$commits" | grep -c '^-' || true)"
            {
              printf '\n<details>\n<summary>%s commits in this release</summary>\n\n' "$count"
              printf '%s\n' "$commits"
              printf '\n</details>\n'
            } >> release-notes.md
          fi

          echo '----- release-notes.md -----'
          cat release-notes.md

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes=release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to registry.maurus.net
        uses: docker/login-action@v4
        with:
          registry: registry.maurus.net
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Determine image tags
        id: meta
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            echo "version=$version"
            # Same commit/date format goreleaser stamps into the binaries.
            echo "commit=${GITHUB_SHA::7}"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "tags=registry.maurus.net/agent-tools/artifactsd:$version,registry.maurus.net/agent-tools/artifactsd:latest"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            DATE=${{ steps.meta.outputs.date }}
          tags: ${{ steps.meta.outputs.tags }}
