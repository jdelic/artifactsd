version: 2
updates:
  # Go modules. Minor and patch updates come as one grouped PR; major updates
  # (new module paths, possible API breaks) come as separate PRs.
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      go-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Developer tools pinned as `tool` dependencies (tools/, tools/goreleaser/).
  # Only the tools themselves are updated; their own dependencies follow the
  # versions each tool release requires.
  - package-ecosystem: "gomod"
    directories:
      - "/tools"
      - "/tools/goreleaser"
    schedule:
      interval: "weekly"
    allow:
      - dependency-name: "github.com/golangci/golangci-lint/v2"
      - dependency-name: "golang.org/x/vuln"
      - dependency-name: "github.com/goreleaser/goreleaser/v2"
    groups:
      dev-tools:
        patterns: ["*"]

  # Actions used in .github/workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]

  # Base images in the Dockerfile. The golang build image must keep up with
  # the "go"/"toolchain" lines in go.mod, which gomod updates can raise.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      docker-images:
        patterns: ["*"]
